<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilkShakeMiX</title>
<style>
  body {
    font-family: 'Fredoka One', sans-serif;
    background-color: #ffeef6;
    margin: 0;
    padding: 0;
    text-align: center;
  }
  header {
    background-color: #ff5fa2;
    color: white;
    padding: 15px 0;
    font-size: 28px;
  }
  button {
    background-color: #ff5fa2;
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
  }
  .categoria {
    font-size: 22px;
    color: #ff5fa2;
    margin-top: 25px;
    text-align: left;
    margin-left: 20px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 10px;
  }
  .item {
    background-color: #ffb6d9;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
  }
  .detalhes {
    background-color: white;
    margin: 20px auto;
    padding: 20px;
    border-radius: 20px;
    max-width: 800px;
    text-align: left;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
  }
  .colunas {
    display: flex;
    justify-content: space-between;
    gap: 40px;
  }
  .coluna {
    flex: 1;
  }
  ul {
    list-style-type: disc;
    padding-left: 20px;
  }
</style>
</head>
<body>
<header>
  MilkShakeMiX<br>
  <button onclick="atualizarDados()">Atualizar Dados</button>
</header>

<div id="conteudo"></div>

<script>
async function carregarCSV() {
  try {
    const resposta = await fetch('https://raw.githubusercontent.com/milkshakemixassai/milkshakemix_cardapio/main/modelo_receitas_atualizado.csv?_=' + new Date().getTime());
    const texto = await resposta.text();
    const linhas = texto.split(/\r?\n/).filter(l => l.trim().length > 0);
    const dados = [];
    for (let i = 1; i < linhas.length; i++) {
      const partes = linhas[i].match(/(?:\"([^"]*)\"|([^,]+))/g)?.map(v => v.replace(/^\"|\"$/g, '').trim());
      if (partes && partes.length >= 7) {
        dados.push({
          categoria: partes[0],
          nome: partes[1],
          tamanho: partes[2],
          ingredientes: partes[3],
          preparo: partes[4],
          observacoes: partes[5],
          imagem: partes[6]
        });
      }
    }
    montarInterface(dados);
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<p style="color:red">Erro ao processar a planilha. Verifique o formato do arquivo.</p>';
  }
}

function montarInterface(dados) {
  const area = document.getElementById('conteudo');
  area.innerHTML = '';
  const categorias = [...new Set(dados.map(d => d.categoria))];

  categorias.forEach(cat => {
    const h2 = document.createElement('div');
    h2.className = 'categoria';
    h2.textContent = cat;
    area.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';

    const nomes = [...new Set(dados.filter(d => d.categoria === cat).map(d => d.nome))];
    nomes.forEach(nome => {
      const botao = document.createElement('div');
      botao.className = 'item';
      botao.textContent = nome;
      botao.onclick = () => mostrarDetalhes(nome, dados.filter(d => d.nome === nome));
      grid.appendChild(botao);
    });
    area.appendChild(grid);
  });
}

function mostrarDetalhes(nome, registros) {
  const area = document.getElementById('conteudo');
  area.innerHTML = '';
  const titulo = document.createElement('h2');
  titulo.textContent = nome;
  area.appendChild(titulo);

  const seletor = document.createElement('select');
  registros.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.tamanho;
    opt.textContent = r.tamanho;
    seletor.appendChild(opt);
  });
  area.appendChild(seletor);

  const detalhes = document.createElement('div');
  detalhes.className = 'detalhes';
  area.appendChild(detalhes);

  function atualizarTamanho(tam) {
    const reg = registros.find(r => r.tamanho === tam);
    if (!reg) return;

    const ingredientes = reg.ingredientes.split(';').map(i => `<li>${i.trim()}</li>`).join('');
    const preparo = reg.preparo.split(';').map(p => `<li>${p.trim()}</li>`).join('');

    detalhes.innerHTML = `
      <div class="colunas">
        <div class="coluna">
          <h3>Ingredientes:</h3>
          <ul>${ingredientes}</ul>
        </div>
        <div class="coluna">
          <h3>Modo de Preparo:</h3>
          <ul>${preparo}</ul>
        </div>
      </div>
    `;
  }

  seletor.onchange = () => atualizarTamanho(seletor.value);
  atualizarTamanho(registros[0].tamanho);

  const voltar = document.createElement('button');
  voltar.textContent = 'Voltar';
  voltar.onclick = () => carregarCSV();
  area.appendChild(voltar);
}

function atualizarDados() {
  carregarCSV();
}

carregarCSV();
</script>
</body>
</html>
