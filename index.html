<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MilkShakeMiX - Cardápio Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MilkShakeMiX</h1>
    <button id="updateBtn">Atualizar Dados</button>
  </header>
  <main>
    <div id="menu"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    async function loadExcelFile(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Erro ao carregar a planilha');
        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const normalized = normalizeHeaders(json);
        localStorage.setItem('milkshakeMixData', JSON.stringify(normalized));
        renderMenu(normalized);
      } catch (err) {
        console.error(err);
        document.getElementById('menu').innerHTML = `<p style='color:red'>Não foi possível carregar a planilha automaticamente.<br>Use o botão "Atualizar Dados" para selecionar manualmente.</p>`;
      }
    }

    function normalizeHeaders(data) {
      return data.map(item => {
        const newItem = {};
        for (const key in item) {
          const lower = key.trim().toLowerCase();
          if (lower.includes('linha')) newItem.linha = item[key];
          else if (lower.includes('produto')) newItem.produto = item[key];
          else if (lower.includes('ingrediente')) newItem.ingredientes = item[key];
          else if (lower.includes('modo')) newItem.modo = item[key];
          else if (lower.includes('obs')) newItem.obs = item[key];
          else if (lower.includes('imagem')) newItem.imagem = item[key];
        }
        return newItem;
      });
    }

    function renderMenu(data) {
      const menuDiv = document.getElementById('menu');
      menuDiv.innerHTML = '';

      const categorias = {};
      data.forEach(item => {
        const linha = item.linha || 'Outros';
        if (!categorias[linha]) categorias[linha] = [];
        categorias[linha].push(item);
      });

      for (const categoria in categorias) {
        const catDiv = document.createElement('div');
        catDiv.classList.add('categoria');
        const h2 = document.createElement('h2');
        h2.textContent = categoria;
        catDiv.appendChild(h2);

        categorias[categoria].forEach(produto => {
          if (!produto.produto) return;
          const btn = document.createElement('button');
          btn.textContent = produto.produto;
          btn.onclick = () => showProduct(produto);
          catDiv.appendChild(btn);
        });
        menuDiv.appendChild(catDiv);
      }
    }

    function showProduct(produto) {
      const menuDiv = document.getElementById('menu');
      menuDiv.innerHTML = `
        <div class='produto'>
          <h2>${produto.produto || 'Produto sem nome'}</h2>
          <img src='imagens/${produto.imagem || 'sem_foto.jpg'}' alt='${produto.produto}' style='max-width:250px;border-radius:10px;'>
          <p><b>Ingredientes:</b> ${produto.ingredientes || '—'}</p>
          <p><b>Modo de Preparo:</b> ${produto.modo || '—'}</p>
          ${produto.obs ? `<p><b>Observações:</b> ${produto.obs}</p>` : ''}
          <button onclick='init()'>Voltar ao Menu</button>
        </div>
      `;
    }

    function handleFileUpload(file) {
      const reader = new FileReader();
      reader.onload = e => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const normalized = normalizeHeaders(json);
        localStorage.setItem('milkshakeMixData', JSON.stringify(normalized));
        renderMenu(normalized);
      };
      reader.readAsArrayBuffer(file);
    }

    document.getElementById('updateBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.xlsx';
      input.onchange = e => handleFileUpload(e.target.files[0]);
      input.click();
    });

    function init() {
      const cached = localStorage.getItem('milkshakeMixData');
      if (cached) {
        renderMenu(JSON.parse(cached));
      } else {
        loadExcelFile('https://raw.githubusercontent.com/milkshakemixassai/milkshakemix_cardapio/main/modelo_receitas_atualizado.xlsx');
      }
    }

    init();
  </script>
</body>
</html>
