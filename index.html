<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MilkShakeMiX - Cardápio Digital</title>
  <style>
    body {
      font-family: 'Fredoka One', sans-serif;
      background-color: #fff5fa;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ff66a3;
      color: white;
      text-align: center;
      padding: 20px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { font-size: 2.5em; margin: 0; }
    #updateBtn {
      background-color: white;
      color: #ff66a3;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }
    main { padding: 20px; text-align: center; }
    .loading { color: #ff3399; font-size: 1.2em; }
    .categoria {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin: 20px 0;
      padding: 20px;
    }
    .categoria h2 {
      color: #ff3399;
      border-bottom: 2px solid #ffd6e8;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    button {
      background-color: #ff99cc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 1em;
      margin: 5px;
      cursor: pointer;
    }
    button:hover { background-color: #ff66a3; }
    .produto, .tamanho {
      text-align: center;
      background-color: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .colunas {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .coluna {
      width: 45%;
      min-width: 280px;
      background-color: #fff0f6;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h3 {
      color: #ff3399;
      border-bottom: 2px solid #ffd6e8;
      padding-bottom: 5px;
      text-align: center;
    }
    ul { list-style-type: disc; text-align: left; margin: 10px auto; width: 90%; }
    li { margin: 5px 0; line-height: 1.4; }
    .back-btn {
      margin-top: 30px;
      background-color: #ff80b5;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>MilkShakeMiX</h1>
    <button id="updateBtn">Atualizar Dados</button>
  </header>
  <main><div id="menu" class="loading">Carregando dados...</div></main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    var CACHE_KEY = 'milkshakeMixData_iPad';
    var FILE_URL = 'https://raw.githubusercontent.com/milkshakemixassai/milkshakemix_cardapio/main/modelo_receitas_atualizado.xlsx';

    function isOldSafari() {
      return navigator.userAgent.indexOf('Safari') > -1 && navigator.userAgent.indexOf('Version/9') > -1;
    }

    function loadExcelFile(url) {
      document.getElementById('menu').innerHTML = "<p class='loading'>Carregando dados...</p>";
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url + '?v=' + new Date().getTime(), true);
      xhr.responseType = isOldSafari() ? 'text' : 'arraybuffer';

      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var workbook;
            if (isOldSafari()) {
              workbook = XLSX.read(xhr.response, { type: 'binary' });
            } else {
              var data = new Uint8Array(xhr.response);
              workbook = XLSX.read(data, { type: 'array' });
            }
            var sheet = workbook.Sheets[workbook.SheetNames[0]];
            var json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            var normalized = normalizeHeaders(json);
            localStorage.setItem(CACHE_KEY, JSON.stringify(normalized));
            renderMenu(normalized);
          } catch (e) {
            console.log(e);
            showError('Erro ao processar a planilha. Verifique o formato do arquivo.');
          }
        } else {
          useCacheOrError();
        }
      };

      xhr.onerror = useCacheOrError;
      xhr.send();
    }

    function showError(msg) {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached) renderMenu(JSON.parse(cached));
      else document.getElementById('menu').innerHTML = '<p style="color:red">' + msg + '</p>';
    }

    function useCacheOrError() {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached) renderMenu(JSON.parse(cached));
      else document.getElementById('menu').innerHTML = '<p style="color:red">Erro ao carregar dados.</p>';
    }

    function normalizeHeaders(data) {
      var result = [];
      for (var i = 0; i < data.length; i++) {
        var item = data[i];
        var obj = {};
        for (var key in item) {
          var lower = key.toLowerCase();
          if (lower.indexOf('linha') >= 0) obj.linha = item[key];
          else if (lower.indexOf('produto') >= 0) obj.produto = item[key];
          else if (lower.indexOf('tamanho') >= 0) obj.tamanho = item[key];
          else if (lower.indexOf('ingrediente') >= 0) obj.ingredientes = item[key];
          else if (lower.indexOf('modo') >= 0) obj.modo = item[key];
          else if (lower.indexOf('obs') >= 0) obj.obs = item[key];
          else if (lower.indexOf('imagem') >= 0) obj.imagem = item[key];
        }
        result.push(obj);
      }
      return result;
    }

    function renderMenu(data) {
      var menu = document.getElementById('menu');
      menu.innerHTML = '';
      var categorias = {};
      for (var i = 0; i < data.length; i++) {
        var c = data[i].linha || 'Outros';
        if (!categorias[c]) categorias[c] = [];
        categorias[c].push(data[i]);
      }
      for (var cat in categorias) {
        var div = document.createElement('div');
        div.className = 'categoria';
        div.innerHTML = '<h2>' + cat + '</h2>';
        var produtosUnicos = {};
        for (var j = 0; j < categorias[cat].length; j++) {
          var p = categorias[cat][j];
          var nome = (p.produto || '').toLowerCase();
          if (!nome) continue;
          if (!produtosUnicos[nome]) produtosUnicos[nome] = [];
          produtosUnicos[nome].push(p);
        }
        for (var nome in produtosUnicos) {
          var p = produtosUnicos[nome][0];
          var btn = document.createElement('button');
          btn.textContent = p.produto;
          btn.onclick = (function(grupo) {
            return function() { showTamanhos(grupo); };
          })(produtosUnicos[nome]);
          div.appendChild(btn);
        }
        menu.appendChild(div);
      }
    }

    function showTamanhos(group) {
      var menu = document.getElementById('menu');
      var produto = group[0];
      var html = "<div class='produto'><h2>" + produto.produto + "</h2>";
      html += "<img src='imagens/" + (produto.imagem || "sem_foto.jpg") + "' alt='" + produto.produto + "'>";
      html += "<h3>Selecione o tamanho:</h3>";
      for (var i = 0; i < group.length; i++) {
        html += "<button onclick='showDetalhes(" + JSON.stringify(group[i]).replace(/'/g, "&apos;") + ")'>" + (group[i].tamanho || 'Tamanho único') + "</button>";
      }
      html += "<br><br><button class='back-btn' onclick='init()'>Voltar</button></div>";
      menu.innerHTML = html;
    }

    function showDetalhes(d) {
      var menu = document.getElementById('menu');
      function lista(txt) {
        if (!txt) return '<p>—</p>';
        var partes = txt.split(';');
        var out = '<ul>';
        for (var i = 0; i < partes.length; i++) {
          out += '<li>' + partes[i].trim() + '</li>';
        }
        out += '</ul>';
        return out;
      }
      var html = "<div class='tamanho'><h2>" + d.produto + " - " + (d.tamanho || 'Tamanho único') + "</h2>";
      html += "<img src='imagens/" + (d.imagem || "sem_foto.jpg") + "' alt='" + d.produto + "'>";
      html += "<div class='colunas'><div class='coluna'><h3>Ingredientes</h3>" + lista(d.ingredientes) + "</div>";
      html += "<div class='coluna'><h3>Modo de Preparo</h3>" + lista(d.modo) + "</div></div>";
      if (d.obs) html += "<p><b>Observações:</b> " + d.obs + "</p>";
      html += "<button class='back-btn' onclick='init()'>Voltar ao Início</button></div>";
      menu.innerHTML = html;
    }

    document.getElementById('updateBtn').onclick = function() {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.xlsx';
      input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          var data = e.target.result;
          var wb = XLSX.read(data, { type: 'binary' });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
          var normalized = normalizeHeaders(json);
          localStorage.setItem(CACHE_KEY, JSON.stringify(normalized));
          renderMenu(normalized);
        };
        reader.readAsBinaryString(file);
      };
      input.click();
    };

    function init() {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached) renderMenu(JSON.parse(cached));
      else loadExcelFile(FILE_URL);
    }

    window.onload = init;
  </script>
</body>
</html>
