<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MilkShakeMiX - Cardápio Digital</title>
  <style>
    body { font-family: 'Fredoka One', Arial, sans-serif; background: #fff6f9; margin: 0; padding: 0; text-align: center; color: #333; }
    header { background-color: #ff6cab; color: white; padding: 15px; font-size: 24px; }
    #menu { margin-top: 20px; }
    .categoria { background-color: #ffe4ec; border-radius: 12px; margin: 10px; padding: 10px; display: inline-block; width: 90%; max-width: 400px; }
    button { background-color: #ff6cab; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin: 5px; font-size: 16px; }
    button:hover { background-color: #ff5294; }
    #detalhes { display: none; margin: 20px; background-color: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 600px; margin-left: auto; margin-right: auto; }
    img { max-width: 200px; height: auto; border-radius: 12px; }
    #logo { width: 100px; margin: 10px auto; display: block; }
  </style>
</head>
<body>
  <header>
    <img id="logo" src="imagens/logo.png" alt="Logo">
    MilkShakeMiX 🍨
  </header>

  <div>
    <button id="uploadBtn">📁 Atualizar dados</button>
    <input type="file" id="fileInput" accept=".xlsx" style="display:none">
  </div>

  <div id="menu"></div>
  <div id="detalhes">
    <h2 id="produtoTitulo"></h2>
    <img id="produtoImagem" src="" alt="Produto">
    <p><strong>Ingredientes:</strong> <span id="produtoIngredientes"></span></p>
    <p><strong>Modo de preparo:</strong> <span id="produtoModo"></span></p>
    <p><strong>Observações:</strong></p>
    <textarea id="observacoes" rows="3" cols="40" placeholder="Digite aqui..." style="border-radius:8px; padding:5px;"></textarea>
    <br><button id="voltarBtn">⬅️ Voltar</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    // Compatível com iOS 9 (sem const/let/arrow)
    var fileInput = document.getElementById('fileInput');
    var uploadBtn = document.getElementById('uploadBtn');
    var menu = document.getElementById('menu');
    var detalhes = document.getElementById('detalhes');

    uploadBtn.onclick = function() { fileInput.click(); };

    fileInput.onchange = function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        var data = new Uint8Array(evt.target.result);
        var workbook = XLSX.read(data, {type: 'array'});
        var sheetName = workbook.SheetNames[0];
        var sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
        exibirMenu(sheet);
      };
      reader.readAsArrayBuffer(file);
    };

    function exibirMenu(dados) {
      menu.innerHTML = '';
      detalhes.style.display = 'none';

      var categorias = {};
      for (var i=0; i<dados.length; i++) {
        var item = dados[i];
        var cat = item.Categoria || 'Outros';
        if (!categorias[cat]) categorias[cat] = [];
        categorias[cat].push(item);
      }

      for (var catNome in categorias) {
        var divCat = document.createElement('div');
        divCat.className = 'categoria';
        var h2 = document.createElement('h2');
        h2.innerHTML = catNome;
        divCat.appendChild(h2);

        for (var j=0; j<categorias[catNome].length; j++) {
          (function(produto){
            var btn = document.createElement('button');
            btn.innerHTML = produto.Produto;
            btn.onclick = function(){ mostrarDetalhes(produto); };
            divCat.appendChild(btn);
          })(categorias[catNome][j]);
        }

        menu.appendChild(divCat);
      }
    }

    function mostrarDetalhes(produto) {
      document.getElementById('produtoTitulo').innerHTML = produto.Produto;
      document.getElementById('produtoImagem').src = 'imagens/' + (produto.Imagem || 'generico.png');
      document.getElementById('produtoIngredientes').innerHTML = produto.Ingredientes || '';
      document.getElementById('produtoModo').innerHTML = produto['Modo de Preparo'] || '';
      detalhes.style.display = 'block';
      menu.style.display = 'none';
    }

    document.getElementById('voltarBtn').onclick = function() {
      detalhes.style.display = 'none';
      menu.style.display = 'block';
    };
  </script>
</body>
</html>
