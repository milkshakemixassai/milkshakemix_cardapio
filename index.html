<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MilkShakeMiX - Cardápio Digital</title>
  <style>
    body {
      font-family: 'Fredoka One', sans-serif;
      background-color: #fff5fa;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ff66a3;
      color: white;
      text-align: center;
      padding: 20px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { font-size: 2.5em; margin: 0; }
    #updateBtn {
      background-color: white;
      color: #ff66a3;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #updateBtn:hover { background-color: #ffe0ef; transform: scale(1.05); }
    main { padding: 20px; }
    .categoria {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin: 20px 0;
      padding: 20px;
    }
    .categoria h2 {
      color: #ff3399;
      border-bottom: 2px solid #ffd6e8;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    button {
      background-color: #ff99cc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 1em;
      margin: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background-color: #ff66a3; }
    .produto {
      text-align: center;
      background-color: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: fadeIn 0.5s ease;
    }
    .produto img {
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 250px;
    }
    .tamanho {
      background-color: #ffe6f2;
      margin: 15px 0;
      padding: 15px;
      border-radius: 15px;
      text-align: left;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <header>
    <h1>MilkShakeMiX</h1>
    <button id="updateBtn">Atualizar Dados</button>
  </header>
  <main><div id="menu"></div></main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const CACHE_KEY = 'milkshakeMixData_grouped_v1';

    async function loadExcelFile(url) {
      try {
        const response = await fetch(url + '?t=' + new Date().getTime(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Erro ao carregar planilha');
        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const normalized = normalizeHeaders(json);
        localStorage.setItem(CACHE_KEY, JSON.stringify(normalized));
        renderMenu(normalized);
      } catch (err) {
        console.warn('Erro ao carregar automaticamente:', err);
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) renderMenu(JSON.parse(cached));
        else document.getElementById('menu').innerHTML = '<p style="color:red">Erro ao carregar os dados.</p>';
      }
    }

    function normalizeHeaders(data) {
      return data.map(item => {
        const n = {};
        for (const key in item) {
          const lower = key.trim().toLowerCase();
          if (lower.includes('linha')) n.linha = item[key];
          else if (lower.includes('produto')) n.produto = item[key];
          else if (lower.includes('tamanho')) n.tamanho = item[key];
          else if (lower.includes('ingrediente')) n.ingredientes = item[key];
          else if (lower.includes('modo')) n.modo = item[key];
          else if (lower.includes('obs')) n.obs = item[key];
          else if (lower.includes('imagem')) n.imagem = item[key];
        }
        return n;
      });
    }

    function renderMenu(data) {
      const menu = document.getElementById('menu');
      menu.innerHTML = '';
      const categorias = {};
      data.forEach(i => {
        const c = i.linha || 'Outros';
        if (!categorias[c]) categorias[c] = [];
        categorias[c].push(i);
      });

      for (const c in categorias) {
        const div = document.createElement('div');
        div.className = 'categoria';
        div.innerHTML = `<h2>${c}</h2>`;

        const produtosUnicos = {};
        categorias[c].forEach(p => {
          const nomeBase = (p.produto || '').trim().toLowerCase();
          if (!nomeBase) return;
          if (!produtosUnicos[nomeBase]) produtosUnicos[nomeBase] = [];
          produtosUnicos[nomeBase].push(p);
        });

        Object.keys(produtosUnicos).forEach(key => {
          const p = produtosUnicos[key][0];
          const btn = document.createElement('button');
          btn.textContent = p.produto;
          btn.onclick = () => showProductGroup(produtosUnicos[key]);
          div.appendChild(btn);
        });

        menu.appendChild(div);
      }
    }

    function showProductGroup(group) {
      const menu = document.getElementById('menu');
      const produto = group[0];
      menu.innerHTML = `
        <div class='produto'>
          <h2>${produto.produto}</h2>
          <img src='imagens/${produto.imagem || 'sem_foto.jpg'}' alt='${produto.produto}'>
          ${group.map(g => `
            <div class='tamanho'>
              <h3>${g.tamanho || 'Tamanho único'}</h3>
              <p><b>Ingredientes:</b> ${g.ingredientes || '—'}</p>
              <p><b>Modo de Preparo:</b> ${g.modo || '—'}</p>
              ${g.obs ? `<p><b>Obs:</b> ${g.obs}</p>` : ''}
            </div>
          `).join('')}
          <button onclick='init()'>Voltar</button>
        </div>`;
    }

    document.getElementById('updateBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.xlsx';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return alert('Nenhum arquivo selecionado');
        handleFileUpload(file);
      };
      input.click();
    });

    function handleFileUpload(file) {
      const reader = new FileReader();
      reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const normalized = normalizeHeaders(json);
        localStorage.setItem(CACHE_KEY, JSON.stringify(normalized));
        renderMenu(normalized);
      };
      reader.readAsArrayBuffer(file);
    }

    function init() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) renderMenu(JSON.parse(cached));
      else loadExcelFile('https://raw.githubusercontent.com/milkshakemixassai/milkshakemix_cardapio/main/modelo_receitas_atualizado.xlsx');
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
